[project]
name = "serviq-api"
version = "0.1.0"
description = "FastAPI HTTP surface for SERVIQ field service module."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "PyJWT>=2.8",
]

[project.scripts]
app = "serviq.main:app"

[project.optional-dependencies]
dev = [
    "httpx>=0.24",
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serviq"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "serviq.main:app"
